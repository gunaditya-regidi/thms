services:
  - type: web
    name: treasure-hunt-system
    env: python
    buildCommand: pip install -r requirements.txt
    # Run command starts gunicorn worker class eventlet for SocketIO WebSockets
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: STATS_PASSWORD
        value: nstl@321
      
      # Optional: switch to postgresql when databases are provisioned:
      # - key: DATABASE_URL
      #   value: postgresql://username:password@hostname:port/database

# Note for Production Persistence:
# To prevent SQLite database resets when Render containers restart on the free tier, 
# you can mount a persistent disk. Add this block under services if upgrading to Starter tier:
#     disk:
#       name: sqlite-data
#       mountPath: /opt/render/project/src
#       sizeGB: 1
