<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TREASURE HUNT - LRDC 2026{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Main Container -->
    <div class="{% block container_class %}container py-4{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <!-- Live Update Bootstrap Toasts -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Template Toast (cloned by JS) -->
        <div id="liveToast" class="toast glass-card" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="toast-header border-bottom-0 bg-transparent text-primary">
                <i class="bi bi-bell-fill text-primary me-2"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <small class="text-secondary" id="toastTime">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body text-secondary" id="toastBody">
                System action logged.
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Socket.io Client JS -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Theme Switcher and SocketIO Listeners -->
    <script>
        // 1. Dark Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
        }
        
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark-mode')) {
                document.documentElement.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }
        
        initTheme();

        // 2. Real-Time Toast Alerts via Socket.io
        document.addEventListener('DOMContentLoaded', () => {
            const socket = io();
            
            function showLiveToast(title, body, iconClass = 'bi-bell-fill') {
                const toastEl = document.getElementById('liveToast');
                const clone = toastEl.cloneNode(true);
                clone.id = 'toast_' + Date.now();
                
                // Update elements
                clone.querySelector('#toastTitle').innerText = title;
                clone.querySelector('#toastBody').innerText = body;
                clone.querySelector('i').className = `bi ${iconClass} me-2`;
                
                // Add to container
                document.querySelector('.toast-container').appendChild(clone);
                
                const bsToast = new bootstrap.Toast(clone);
                bsToast.show();
                
                // Remove from DOM on hidden
                clone.addEventListener('hidden.bs.toast', () => {
                    clone.remove();
                });
            }

            // Bind Socket Events
            socket.on('connect', () => {
                console.log('Connected to THMS Real-Time Socket Gateway.');
            });

            socket.on('register_team', (data) => {
                showLiveToast(
                    'New Team Registered!',
                    `Team "${data.team_name}" has joined the hunt! Assigned to ${data.house} House.`,
                    'bi-person-plus-fill'
                );
                // Trigger page elements refresh if dynamic functions exist
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('task_completed', (data) => {
                showLiveToast(
                    'Task Completed!',
                    `Team "${data.team_name}" (${data.house} House) completed a Round 1 task. Progress: ${data.completed_count}/10.`,
                    'bi-check-circle-fill'
                );
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('r1_requested', (data) => {
                showLiveToast(
                    'Round 1 Verification Requested',
                    `Team "${data.team_name}" (${data.house} House) has finished all tasks and requested verification.`,
                    'bi-exclamation-triangle-fill'
                );
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('r1_verified', (data) => {
                showLiveToast(
                    'Round 1 Verified',
                    `Team "${data.team_name}" (${data.house} House) has been physically verified by their Manager.`,
                    'bi-shield-check'
                );
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('r1_approved', (data) => {
                showLiveToast(
                    'Round 1 Approved!',
                    `Team "${data.team_name}" (${data.house} House) has been approved by Admin! Round 2 (QR Hunt) is unlocked.`,
                    'bi-unlock-fill'
                );
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('qr_scanned', (data) => {
                let title = 'QR Code Scanned';
                let icon = 'bi-qr-code';
                let desc = `Team "${data.team_name}" (${data.house} House) scanned a QR code.`;
                
                if (data.type === 'correct') {
                    title = 'Correct Clue Solved!';
                    icon = 'bi-check-circle';
                    desc = `Team "${data.team_name}" solved Clue #${data.clue_number}!`;
                } else if (data.type === 'dummy') {
                    title = 'Dummy Clue Triggered';
                    icon = 'bi-x-circle';
                    desc = `Team "${data.team_name}" scanned a dummy coordinate.`;
                } else if (data.type === 'repeated') {
                    title = 'Repeated Clue Scan';
                    desc = `Team "${data.team_name}" scanned clue #${data.clue_number} again.`;
                } else if (data.type === 'out_of_order') {
                    title = 'Incorrect Sequence Scan';
                    icon = 'bi-exclamation-octagon';
                    desc = `Team "${data.team_name}" scanned a clue out of order.`;
                }
                
                showLiveToast(title, desc, icon);
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });

            socket.on('team_finished', (data) => {
                showLiveToast(
                    'HUNT COMPLETED!',
                    `CONGRATULATIONS: Team "${data.team_name}" (${data.house} House) has found all 7 clues and completed the Hunt!`,
                    'bi-trophy-fill'
                );
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });
            
            socket.on('team_reset', (data) => {
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });
            
            socket.on('team_qr_reset', (data) => {
                if (typeof refreshDashboardData === 'function') refreshDashboardData();
            });
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
